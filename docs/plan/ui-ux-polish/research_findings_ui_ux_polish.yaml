gaps:
  - area: "Sprints, Templates, Time-tracking, Intake surfaces"
    description: "These feature surfaces were not deeply examined in this research pass. They likely share the same patterns and gaps but were not individually verified."
    impact: research_blocker
    affects: ["comprehensive-coverage"]

  - area: "Color contrast ratios"
    description: "Did not perform automated contrast ratio testing. Text colors like text-slate-500 on bg-background-dark (#0a0a0a) and text-slate-600 on neutral surfaces (#111111) are likely below 4.5:1 AA ratio."
    impact: research_blocker
    affects: ["accessibility-contrast"]

  - area: "Touch target sizes"
    description: "Did not audit minimum touch target sizes (48x48px per WCAG 2.5.8). Many icon-only buttons appear to be 32px or smaller."
    impact: nice_to_know
    affects: ["mobile-usability"]
