# PATTERNS FOUND
# ═══════════════════════════════════════════════════════════════════════════════

patterns_found:
  - category: architecture
    pattern: "Layout-Surface-Toolbar-Detail-Data module pattern"
    description: "Every feature follows layout (state + orchestration) → surface (visual content) → toolbar (search/filter/view) → detail (side panel) → data (types + mocks) structure."
    examples:
      - file: components/board/
        location: "board-layout.tsx, board-surface.tsx, board-toolbar.tsx, task-detail.tsx, data.ts"
        snippet: "Consistent across all 15+ feature directories"
    prevalence: common

  - category: naming
    pattern: "Feature-prefixed component naming"
    description: "All components are named {feature}-{role}.tsx: board-layout, calendar-surface, goals-toolbar, inbox-detail"
    examples:
      - file: components/calendar/
        location: "calendar-layout.tsx, calendar-surface.tsx, calendar-toolbar.tsx, calendar-detail.tsx"
        snippet: "Consistent naming convention"
    prevalence: common

  - category: structure
    pattern: "AnimatePresence for detail panels"
    description: "Detail side panels uniformly use AnimatePresence wrapping a motion.div that slides from right (x: 100% → 0)"
    examples:
      - file: components/calendar/calendar-layout.tsx
        location: "line 138-151"
        snippet: "<AnimatePresence>{selectedItem && <div className='absolute top-0 right-0 bottom-0 z-20'><CalendarDetail ... /></div>}</AnimatePresence>"
    prevalence: common

  - category: error_handling
    pattern: "Inconsistent error display"
    description: "Error states use 3 different patterns: inline rose banner (projects, calendar), EmptyState with retry (inbox, workload), and no error handling at all (board, goals)"
    examples:
      - file: components/projects/projects-layout.tsx
        location: "line 69"
        snippet: "rounded-sm border border-rose-500/20 bg-rose-500/10 px-4 py-3"
      - file: components/inbox/inbox-layout.tsx
        location: "line 100"
        snippet: "<EmptyState icon={TriangleAlert} title='Inbox unavailable' ... actionLabel='Retry' />"
    prevalence: occasional

  - category: structure
    pattern: "Custom dropdown with click-outside"
    description: "All dropdown menus are hand-rolled: useState boolean + useRef + mousedown listener for click-outside. No shared primitive."
    examples:
      - file: components/board/task-detail.tsx
        location: "line 372-386"
        snippet: "const [dropdownOpen, setDropdownOpen] = useState(false); const dropdownRef = useRef(...); useEffect clicking outside"
      - file: components/docs/docs-editor.tsx
        location: "line 619-746"
        snippet: "const [showFolderDropdown, setShowFolderDropdown] = useState(false); const folderDropdownRef = useRef(...)"
    prevalence: common

  - category: naming
    pattern: "Inconsistent focus style pattern"
    description: "Input focus uses multiple variations: focus:outline-none focus:border-primary, focus:border-primary/50, focus:ring-1 focus:ring-primary/40, focus:bg-white/[0.05]"
    examples:
      - file: components/workload/workload-toolbar.tsx
        location: "line 83"
        snippet: "focus:border-primary/40 focus:outline-none"
      - file: components/docs/docs-sidebar.tsx
        location: "line 245"
        snippet: "focus:border-primary/50 focus:outline-none focus:ring-1 focus:ring-primary/50"
    prevalence: common

