    - pattern: "Detail panel slide-in"
      files: ["components/calendar/calendar-detail.tsx", "components/board/task-detail.tsx"]
      type: "x: 100% → 0 with spring animation"
      quality: good

    - pattern: "Toast notifications"
      file: components/ui/toast.tsx
      type: "AnimatePresence with slide + opacity"
      quality: good

    - pattern: "Automations cards"
      file: components/automations/automations-layout.tsx
      type: "opacity + y-offset (12-18px) for enter/exit"
