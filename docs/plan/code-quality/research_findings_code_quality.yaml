plan_id: code-quality-deep-enhancement
objective: "Investigate code quality issues across the PM SaaS frontend: large files, dead code, duplication, ESLint gaps, type safety, and import organization"
focus_area: code-quality-cleanup
created_at: "2026-04-16"
created_by: gem-researcher
status: completed

tldr: |
  - 15 component files exceed 300 lines; top offender is time-tracking-layout.tsx at 1,799 lines. Seven files are 600+ lines and need decomposition.
  - contexts/app-data-context.tsx (714 lines) is legacy dead code: not mounted in providers.tsx, only re-exported by one data file. ai-copilot-provider.tsx is similarly legacy scaffolding.
  - types/shared.ts exists but has zero consumers — all feature modules define their own types in local data.ts files, creating pervasive type duplication.
  - ESLint config is bare-minimum (eslint-config-next only), no custom rules, no import ordering, no unused-import detection. Build does NOT run ESLint.
  - TypeScript strict mode is enabled and there are zero `any` type usages and zero @ts-ignore directives — type safety is excellent.
  - Five eslint-disable comments exist (3× react-hooks/exhaustive-deps, 1× set-state-in-effect, 1× no-img-element).

research_metadata:
  methodology: "Hybrid retrieval: grep_search for patterns, run_in_terminal for line counts and metrics, read_file for config examination. Two research passes."
  scope: "All 144 frontend source files in components/, app/, contexts/, hooks/, lib/ (~38,429 lines). Config files at root."
  confidence: high
  coverage: 95
  decision_blockers: 0
  research_blockers: 0

