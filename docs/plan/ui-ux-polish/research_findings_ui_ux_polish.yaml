      issue: "Gantt-style timeline renders as wide horizontal chart. No mobile adaptation or summary view."
      impact: medium

    - component: Goals tree
      file: components/goals/goals-surface.tsx
      issue: "Nested tree view with indentation levels. No responsive collapse or simplified view for mobile."
      impact: medium

    - component: Reports charts
      file: components/reports/reports-surface.tsx
