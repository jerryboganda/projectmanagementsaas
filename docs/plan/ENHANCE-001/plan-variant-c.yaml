    6 monolithic component files. Backend changes limited to Program.cs, appsettings, and
    next.config.ts for headers.
  affected_areas:
    - "contexts/ — remove app-data-context.tsx, update providers.tsx"
    - "types/shared.ts — consolidate User/Status/Priority from 4+ data.ts files"
    - "components/ui/ — add Button, Input, Avatar, Tooltip, Skeleton, Dropdown, Progress"
    - "components/time-tracking/ — extract into layout/surface/toolbar/detail"
