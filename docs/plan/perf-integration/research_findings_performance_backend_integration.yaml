# ═══════════════════════════════════════════════════════════════
# RESEARCH FINDINGS — PRIORITIZED IMPROVEMENTS
# ═══════════════════════════════════════════════════════════════

top_15_performance_improvements:
  - rank: 1
    title: "Dynamic import Recharts (code splitting)"
    category: bundle_size
    impact: high
    effort: low
    description: |
      recharts is ~200KB gzipped and only used by components/reports/reports-surface.tsx.
      Wrap with next/dynamic: `const ReportsSurface = dynamic(() => import('./reports-surface'), { ssr: false })`.
      Saves ~200KB from every non-reports page bundle.

  - rank: 2
    title: "Dynamic import @hello-pangea/dnd"
    category: bundle_size
    impact: high
    effort: low
    description: |
      DnD library (~40KB) only used in board feature. Dynamic import board-surface.tsx or the DnD wrapper.
      Removes DnD from all non-board pages.

  - rank: 3
    title: "Lift Sidebar and Header into app layout"
    category: rendering_performance
    impact: high
    effort: medium
    description: |
      Currently every page.tsx re-imports and re-mounts <Sidebar> and <Header>.
      Move to a shared layout.tsx (e.g., app/(workspace)/layout.tsx) so they persist across navigation.
      Eliminates re-render and re-mount of sidebar on every route change.

  - rank: 4
    title: "Delete dead app-data-context.tsx"
    category: bundle_size
    impact: medium
    effort: low
    description: |
      815-line file with zero consumers. Contains ~500 lines of inline mock data objects.
      Removing it eliminates dead code from the module graph and speeds up builds.

  - rank: 5
    title: "Wire SignalR for inbox/notifications"
    category: realtime
    impact: high
    effort: medium
    description: |
      Inbox currently only refreshes on mount. Adding SignalR subscription for notification events
      (NotificationCreated, NotificationRead) via /hubs/notifications would enable real-time
      unread badge updates without polling.

  - rank: 6
    title: "Migrate intake from mock data to real API"
    category: backend_integration
    impact: high
    effort: medium
    description: |
      use-intake-data.ts is the only remaining feature hook using MOCK_ data with useState.
      Needs refactor to useQuery/useMutation pattern matching all other hooks.
      Backend endpoints exist (IntakeFormResponse, IntakeSubmissionResponse in contracts.ts).

  - rank: 7
    title: "Add optimistic updates to more mutations"
    category: data_fetching
    impact: medium
    effort: medium
    description: |
      Only use-projects-data.ts (toggleFavorite) and use-board-data.ts (updateTaskStatus) use
      optimistic updates. Calendar, goals, documents, settings mutations just invalidate on success.
      Adding optimistic patterns for frequent actions (goal progress, calendar item drag) improves perceived latency.

  - rank: 8
    title: "Dynamic import motion/react for heavy animation consumers"
    category: bundle_size
    impact: medium
    effort: medium
    description: |
      motion is used in 15+ components. While tree-shaking helps, the AnimatePresence import
      pulls in the full animation engine. Consider dynamic importing heavy consumers like
      onboarding-wizard, AI copilot panel, and settings panels.

  - rank: 9
    title: "Add gcTime tuning per feature"
    category: data_fetching
    impact: medium
    effort: low
    description: |
      Global gcTime defaults to 5 minutes. Stale reference data (members, templates, workspace settings)
      should have longer gcTime (30min). Frequently-updated data (tasks, notifications) should keep 5min.
      docs/frontend-to-backend-integration-matrix.md recommends gcTime:5min but it's not set explicitly.

  - rank: 10
    title: "Wire SignalR for document collaboration"
    category: realtime
    impact: medium
    effort: high
    description: |
      docs-editor.tsx is a rich document editor with no realtime collaboration.
      Subscribing to /hubs/documents for DocumentUpdated/CursorMoved events would
      enable multi-user editing without polling.

  - rank: 11
    title: "Add prefetching for sidebar navigation targets"
    category: data_fetching
    impact: medium
    effort: low
    description: |
      No prefetchQuery calls exist. When hovering sidebar nav items, prefetch the destination
      feature's query data. E.g., hovering "Board" prefetches tasks. Low cost, high UX improvement.

  - rank: 12
    title: "Dynamic import react-markdown + remark-gfm"
    category: bundle_size
    impact: medium
    effort: low
    description: |
      react-markdown + remark-gfm only used in docs editor. Dynamic import the markdown
      preview component to avoid bundling markdown parsing on non-docs pages.

  - rank: 13
    title: "Add @next/bundle-analyzer to devDependencies"
    category: bundle_size
    impact: low
    effort: low
    description: |
      No bundle analysis tooling exists. Adding @next/bundle-analyzer enables visibility
      into actual chunk sizes and identifies optimization targets with data.

  - rank: 14
    title: "Wire SignalR for sprint/timeline updates"
    category: realtime
    impact: medium
    effort: medium
    description: |
      Sprints and timeline are collaborative surfaces where multiple users modify task status
      and dates. Adding SprintUpdated/TaskReordered events would keep views in sync.

  - rank: 15
    title: "Add next.config experimental.optimizePackageImports"
    category: bundle_size
    impact: low
    effort: low
    description: |
      Next.js 15 supports experimental.optimizePackageImports for libraries like lucide-react,
      date-fns, and recharts. Adding this config can automatically tree-shake barrel exports
      and reduce unused import costs.

