patterns_found:
  - category: architecture
    pattern: "httpOnly cookie refresh + in-memory JWT access token"
    description: "Refresh tokens stored in httpOnly, SameSite=Lax cookies. Access tokens held in React state only — never persisted to localStorage/sessionStorage. This is the OWASP-recommended pattern."
    examples:
      - file: contexts/auth-context.tsx
        location: contexts/auth-context.tsx:55-70
        snippet: "const [session, setSession] = useState<PersistedAuthSession | null>(null);"
      - file: AuthCookieHelper.cs
        location: backend/src/LinearPrecision.Api/Modules/Identity/Endpoints/AuthCookieHelper.cs:8-18
        snippet: "HttpOnly = true, SameSite = SameSiteMode.Lax, Secure = httpContext.Request.IsHttps"
    prevalence: common

  - category: architecture
    pattern: "JWT revocation via Redis blocklist"
    description: "Access token JTI is blocklisted in Redis on logout. OnTokenValidated event checks blocklist before accepting token."
    examples:
      - file: Program.cs
        location: backend/src/LinearPrecision.Api/Program.cs:133-143
        snippet: "var isBlocked = await db.KeyExistsAsync($\"blocklist:at:{jti}\"); if (isBlocked) context.Fail()"
    prevalence: common

  - category: architecture
    pattern: "Refresh token rotation"
    description: "On refresh, old token is deleted from Redis before issuing new pair. Prevents refresh token replay attacks."
    examples:
      - file: TokenService.cs
        location: backend/src/LinearPrecision.Api/Modules/Identity/Services/TokenService.cs:83-100
        snippet: "await db.KeyDeleteAsync($\"{RefreshTokenKeyPrefix}{tokenHash}\"); ... return await GenerateTokenPairAsync(user)"
    prevalence: common

  - category: architecture
    pattern: "EF Core global query filters for tenant isolation"
    description: "TenantEntity types are filtered by WorkspaceId at the DbContext level. Worker jobs explicitly bypass with IgnoreQueryFilters()."
    examples:
      - file: AppDbContext.cs
        location: backend/src/LinearPrecision.Api/Infrastructure/Persistence/AppDbContext.cs:161
        snippet: ".HasQueryFilter(e => e.WorkspaceId == _tenantContext.WorkspaceId)"
    prevalence: common

  - category: error_handling
    pattern: "RFC 7807 ProblemDetails for all API errors"
    description: "GlobalExceptionMiddleware maps domain exceptions to typed ProblemDetails. Development mode leaks stack traces."
    examples:
      - file: GlobalExceptionMiddleware.cs
        location: backend/src/LinearPrecision.Api/Infrastructure/Middleware/GlobalExceptionMiddleware.cs:57-63
        snippet: "var detail = _environment.IsDevelopment() ? ex.ToString() : \"An unexpected error occurred.\";"
    prevalence: common

  - category: naming
    pattern: "Open redirect prevention"
    description: "normalizeAppRedirect rejects non-relative and protocol-relative URLs for login redirect parameter."
    examples:
      - file: redirects.ts
        location: lib/auth/redirects.ts:1-13
        snippet: "if (!trimmed.startsWith('/') || trimmed.startsWith('//')) return null;"
    prevalence: common

  - category: architecture
    pattern: "FluentValidation on all identity endpoints"
    description: "All auth request types (Register, Login, ForgotPassword, ResetPassword) have dedicated FluentValidation validators."
    examples:
      - file: RegisterRequestValidator.cs
        location: backend/src/LinearPrecision.Api/Modules/Identity/Validators/RegisterRequestValidator.cs:1-25
        snippet: "RuleFor(x => x.Password).NotEmpty().MinimumLength(8).Matches(\"[A-Z]\").Matches(\"[a-z]\").Matches(\"[0-9]\")"
    prevalence: common

related_architecture:
  components_relevant_to_domain:
    - component: AuthProvider (React Context)
      responsibility: "Frontend auth state management and API coordination"
      location: contexts/auth-context.tsx
      relationship_to_domain: "Primary auth state holder — stores JWT in memory"
    - component: GlobalExceptionMiddleware
      responsibility: "Converts all unhandled exceptions to ProblemDetails"
      location: backend/src/LinearPrecision.Api/Infrastructure/Middleware/GlobalExceptionMiddleware.cs
      relationship_to_domain: "Controls what error information reaches the client"
    - component: TenantResolutionMiddleware
      responsibility: "Resolves tenant workspace from header or route"
      location: backend/src/LinearPrecision.Api/Infrastructure/Middleware/TenantResolutionMiddleware.cs
      relationship_to_domain: "Key tenant isolation boundary in the middleware pipeline"
    - component: TokenService
      responsibility: "JWT+refresh token pair lifecycle management"
      location: backend/src/LinearPrecision.Api/Modules/Identity/Services/TokenService.cs
      relationship_to_domain: "Core token security: rotation, hashing, revocation"
  interfaces_used_by_domain:
    - interface: ICurrentUser
      location: backend/src/LinearPrecision.Api/Infrastructure/Auth/CurrentUserAccessor.cs
      usage_pattern: "Extracts user identity from JWT claims via HttpContext"
    - interface: ITenantContext
      location: backend/src/LinearPrecision.Api/Infrastructure/Auth/TenantContext.cs
      usage_pattern: "Carries resolved workspace ID through request pipeline"
  data_flow_involving_domain: |
    Login → AuthEndpoints.LoginAsync → Identity check → TokenService.GenerateTokenPairAsync →
    JWT access token in response body + refresh token in httpOnly cookie →
    Frontend stores accessToken in React state → API client sends Authorization: Bearer header →
    Backend validates JWT + checks Redis blocklist → TenantResolutionMiddleware reads X-Workspace-Id →
    EF query filters restrict data to workspace
  key_relationships_to_domain:
    - from: AuthEndpoints
      to: TokenService
      relationship: calls
    - from: TokenService
      to: JwtTokenGenerator
      relationship: calls
    - from: TokenService
      to: Redis (IConnectionMultiplexer)
      relationship: calls
    - from: JwtBearerEvents.OnTokenValidated
      to: Redis blocklist
      relationship: calls
    - from: AuthProvider (frontend)
      to: LinearPrecisionApiClient
      relationship: calls

