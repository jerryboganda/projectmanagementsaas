plan_id: security-hardening
objective: "OWASP Top 10 security audit of the Linear Precision PM SaaS codebase"
focus_area: security-hardening-owasp
created_at: "2026-04-16T00:00:00Z"
created_by: gem-researcher
status: completed

tldr: |
  - Auth architecture is solid: httpOnly refresh cookies, JWT with Redis blocklist revocation, ASP.NET Identity lockout, FluentValidation on all auth endpoints. Access tokens are held in React state only (not localStorage).
  - CRITICAL: No security headers (CSP, HSTS, X-Frame-Options, X-Content-Type-Options) are configured in either the backend API or the Next.js frontend. These are planned (docs reference them) but not implemented.
  - CRITICAL: Rate limiting is defined in Program.cs but never applied to any endpoint group — no `.RequireRateLimiting()` call exists in the codebase, leaving auth brute-force and AI endpoints unprotected.
  - MEDIUM: Development-grade secrets are hardcoded in appsettings.json (JWT key, MinIO credentials, DB password) and shipped in the repo; the .env.example also contains weak placeholder secrets.
  - MEDIUM: Error boundary exposes raw `error.message` to the user on the frontend; GlobalExceptionMiddleware exposes full stack traces in Development mode.
  - No CSRF protection is configured (no antiforgery middleware); mitigated by JWT Bearer + SameSite cookies but not fully addressed for cookie-based refresh flow.
  - No Next.js middleware.ts exists for auth route protection — all auth guards are client-side only.

research_metadata:
  methodology: "Hybrid retrieval: semantic_search + grep_search for pattern discovery, targeted read_file for detailed examination of auth flows, middleware, config, and frontend components."
  scope: "Full-stack: frontend auth context, auth pages, API client, error handling, lib utilities; backend Program.cs, all auth infrastructure (JWT, refresh tokens, cookies, tenant resolution, policies), middleware pipeline, validators, config files, Dockerfile."
  confidence: high
  coverage: 85
  decision_blockers: 2
  research_blockers: 0

