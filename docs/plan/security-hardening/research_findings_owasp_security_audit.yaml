open_questions:
  - question: "Is the production deployment behind a TLS-terminating reverse proxy that sets X-Forwarded-Proto?"
    context: "AuthCookieHelper sets Secure based on IsHttps, which may be false behind HTTP-only backend. ASP.NET UseForwardedHeaders() is not configured in Program.cs."
    type: decision_blocker
    affects: ["cookie-security", "hsts-configuration"]
  - question: "Are appsettings.json secrets overridden in production via environment variables or a secret manager?"
    context: "The hardcoded JWT key and DB credentials in source control are a critical risk only if they leak to production unchanged."
    type: decision_blocker
    affects: ["secret-management", "jwt-security"]
  - question: "Does EF global query filter + authorization policy provide sufficient defense against IDOR attacks?"
    context: "TenantResolutionMiddleware sets tenant from a client-provided header without verifying membership at the middleware level. The authorization handler does verify, but only for endpoints that explicitly require policy."
    type: research
    affects: ["tenant-isolation", "idor-prevention"]
  - question: "Should SameSite=Strict be used instead of Lax for the refresh cookie?"
    context: "Lax allows the cookie to be sent on GET navigations from external sites. Since refresh is POST-only, Strict would add defense-in-depth."
    type: nice_to_know
    affects: ["csrf-protection"]

gaps:
  - area: "Security headers"
    description: "No CSP, HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, or Permissions-Policy headers are set in either the backend API or the Next.js frontend. The observability-reliability-security-plan.md documents these as planned but they are not implemented."
    impact: decision_blocker
    affects: ["clickjacking-prevention", "xss-mitigation", "transport-security"]

  - area: "Rate limiting application"
    description: "Three rate limiters are configured in Program.cs (global, auth, ai) but NO endpoint or endpoint group calls .RequireRateLimiting(). The rate limiting middleware runs but has no policies bound to routes."
    impact: decision_blocker
    affects: ["brute-force-prevention", "dos-protection"]

  - area: "CSRF protection"
    description: "No antiforgery middleware or token validation. Bearer-token auth mitigates most CSRF, but the refresh endpoint consumes a cookie and is vulnerable to CSRF if browser behavior changes."
    impact: research_blocker
    affects: ["csrf-protection"]

  - area: "Next.js middleware for server-side auth"
    description: "No middleware.ts exists. All auth guards are client-side in the AppShellGuard component. Protected server components could render during SSR before the client-side redirect fires."
    impact: research_blocker
    affects: ["route-protection", "content-flash"]

  - area: "Secret management"
    description: "JWT key, DB password, MinIO credentials, Stripe keys, AI API key all have placeholder/development values in appsettings.json committed to source control. No evidence of integration with a secret manager (Azure Key Vault, AWS Secrets Manager, etc.)."
    impact: decision_blocker
    affects: ["credential-security"]

  - area: "CORS AllowAnyMethod"
    description: "CORS policy uses .AllowAnyMethod() which permits DELETE, PATCH, PUT from browser cross-origin requests. Should be restricted to only required methods."
    impact: nice_to_know
    affects: ["cors-hardening"]

  - area: "User enumeration on registration"
    description: "RegisterAsync returns a specific error message revealing whether an email is already registered. ForgotPassword correctly avoids this."
    impact: nice_to_know
    affects: ["information-disclosure"]

  - area: "ForwardedHeaders not configured"
    description: "UseForwardedHeaders() is not called in the middleware pipeline. Behind a reverse proxy, IsHttps will be false and client IP will be the proxy IP."
    impact: research_blocker
    affects: ["cookie-security", "ip-logging"]

  - area: "No client-side password strength UI"
    description: "Registration form mentions password requirements in text but has no real-time strength meter or client-side validation. Server rejects weak passwords, but UX is poor."
    impact: nice_to_know
    affects: ["ux-security"]

# ═══════════════════════════════════════════════════════════════════════════════
# VULNERABILITY SUMMARY (OWASP Top 10 Mapped)
# ═══════════════════════════════════════════════════════════════════════════════

owasp_vulnerability_report:

  critical:
    - id: SEC-001
      owasp_category: "A05:2021 Security Misconfiguration"
      title: "No security response headers (CSP, HSTS, X-Frame-Options)"
      files:
        - path: backend/src/LinearPrecision.Api/Program.cs
          line_range: "316-325 (middleware pipeline)"
          detail: "No security headers middleware registered. No X-Frame-Options → clickjacking. No CSP → XSS amplification. No HSTS → downgrade attacks."
        - path: next.config.ts
          line_range: "3-32"
          detail: "No headers() configuration in Next.js config."
      fix: |
        Backend: Add a SecurityHeadersMiddleware before other middleware that sets:
          X-Frame-Options: DENY
          X-Content-Type-Options: nosniff
          Referrer-Policy: strict-origin-when-cross-origin
          Permissions-Policy: camera=(), microphone=(), geolocation=()
          Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'
          Strict-Transport-Security: max-age=31536000; includeSubDomains (if behind TLS)
        Frontend: Add headers config in next.config.ts or create middleware.ts with appropriate headers.

    - id: SEC-002
      owasp_category: "A07:2021 Identification and Authentication Failures"
      title: "Rate limiters defined but never applied to endpoints"
      files:
        - path: backend/src/LinearPrecision.Api/Program.cs
          line_range: "226-255 (limiter definitions)"
          detail: "Auth limiter (20/15min), global limiter (600/min), AI limiter (30 tokens) are configured but NO endpoint calls .RequireRateLimiting()"
      fix: |
        Apply rate limiting to endpoint groups:
          group.MapPost("/register", ...).RequireRateLimiting("auth");
          group.MapPost("/login", ...).RequireRateLimiting("auth");
          group.MapPost("/forgot-password", ...).RequireRateLimiting("auth");
          group.MapPost("/reset-password", ...).RequireRateLimiting("auth");
        Apply global limiter as default: app.UseRateLimiter() is already called but needs
        endpoint-level .RequireRateLimiting("global") or set GlobalLimiter.

    - id: SEC-003
      owasp_category: "A02:2021 Cryptographic Failures"
      title: "Hardcoded secrets in source-controlled config"
      files:
        - path: backend/src/LinearPrecision.Api/appsettings.json
          line_range: "7"
          detail: "JWT key: 'super-secret-development-key-that-is-at-least-32-bytes-long!'"
        - path: backend/src/LinearPrecision.Api/appsettings.json
          line_range: "3"
          detail: "DB credentials: 'Username=lp;Password=dev'"
        - path: backend/src/LinearPrecision.Api/appsettings.json
          line_range: "15-16"
          detail: "MinIO: 'AccessKey=minioadmin, SecretKey=minioadmin'"
        - path: .env.example
          line_range: "10"
          detail: "JWT_KEY placeholder is also weak"
      fix: |
        1. Move all secrets to environment variables or a secret manager (Azure Key Vault, AWS SSM).
        2. Remove all real/default credentials from appsettings.json — use empty strings or throw on startup if missing.
        3. Add appsettings.*.json to .gitignore or ensure only appsettings.json with non-secret defaults is committed.
        4. Validate JWT key length at startup (minimum 256 bits for HMAC-SHA256).

  medium:
    - id: SEC-004
      owasp_category: "A05:2021 Security Misconfiguration"
      title: "Refresh cookie Secure flag conditional on IsHttps"
      files:
        - path: backend/src/LinearPrecision.Api/Modules/Identity/Endpoints/AuthCookieHelper.cs
          line_range: "15"
          detail: "Secure = httpContext.Request.IsHttps — behind HTTP reverse proxy, Secure will be false"
      fix: |
        1. Configure UseForwardedHeaders() in Program.cs to trust X-Forwarded-Proto from the proxy.
        2. Or unconditionally set Secure = true for production environments:
           Secure = !builder.Environment.IsDevelopment() || httpContext.Request.IsHttps

    - id: SEC-005
      owasp_category: "A01:2021 Broken Access Control"
      title: "No Next.js middleware.ts for server-side route protection"
      files:
        - path: "(root — file does not exist)"
          line_range: "N/A"
          detail: "No middleware.ts → all auth guards are client-side only via AppShellGuard component. Protected pages may render briefly during SSR before redirect."
      fix: |
        Create middleware.ts at project root that checks for refresh token cookie on protected routes
        and redirects to /login if missing. This prevents server-side rendering of protected content.

    - id: SEC-006
      owasp_category: "A07:2021 Identification and Authentication Failures"
      title: "User enumeration on registration endpoint"
      files:
        - path: backend/src/LinearPrecision.Api/Modules/Identity/Endpoints/AuthEndpoints.cs
          line_range: "87-90"
          detail: "Returns 'A user with this email already exists.' — reveals account existence"
      fix: |
        Return a generic validation error that does not confirm email existence, e.g.:
        'Unable to create account with the provided details.' Or silently send a
        'you already have an account' email to the existing user instead.

    - id: SEC-007
      owasp_category: "A05:2021 Security Misconfiguration"
      title: "CORS AllowAnyMethod is overly permissive"
      files:
        - path: backend/src/LinearPrecision.Api/Program.cs
          line_range: "214"
          detail: ".AllowAnyMethod() permits all HTTP methods from allowed origins"
      fix: |
        Restrict to required methods:
        policy.WithMethods("GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS")

    - id: SEC-008
      owasp_category: "A08:2021 Software and Data Integrity Failures"
      title: "No CSRF/antiforgery protection for cookie-based refresh"
      files:
        - path: "backend/src/LinearPrecision.Api (not configured)"
          line_range: "N/A"
          detail: "Refresh endpoint consumes httpOnly cookie without CSRF token validation. SameSite=Lax provides partial mitigation."
      fix: |
        Options (pick one):
        1. Change SameSite from Lax to Strict for refresh cookie (may break cross-site login flows).
        2. Add a custom X-CSRF header requirement on the refresh endpoint and verify it server-side.
        3. Require refresh token in request body (already partially supported) and deprecate cookie-only path.

    - id: SEC-009
      owasp_category: "A01:2021 Broken Access Control"
      title: "TenantResolutionMiddleware trusts X-Workspace-Id without membership verification"
      files:
        - path: backend/src/LinearPrecision.Api/Infrastructure/Middleware/TenantResolutionMiddleware.cs
          line_range: "47-54"
          detail: "Sets tenant context from header without checking user membership. Relies on authorization policies and EF query filters downstream."
      fix: |
        Add a membership check in TenantResolutionMiddleware:
        - After resolving workspace ID and confirming user is authenticated,
          verify the user has an active membership in the workspace before setting tenant context.
        - Return 403 if membership is not found. This provides defense-in-depth beyond query filters.

    - id: SEC-010
      owasp_category: "A05:2021 Security Misconfiguration"
      title: "ForwardedHeaders not configured for reverse proxy"
      files:
        - path: backend/src/LinearPrecision.Api/Program.cs
          line_range: "316-325"
          detail: "UseForwardedHeaders() is not called. Behind a proxy, RemoteIpAddress and IsHttps will be wrong."
      fix: |
        Add before UseCors():
        app.UseForwardedHeaders(new ForwardedHeadersOptions
        {
            ForwardedHeaders = ForwardedHeaders.XForwardedFor | ForwardedHeaders.XForwardedProto
        });

  low:
    - id: SEC-011
      owasp_category: "A09:2021 Security Logging and Monitoring Failures"
      title: "Error boundary exposes raw error.message to users"
      files:
        - path: components/error-boundary.tsx
          line_range: "52"
          detail: "Renders this.state.error?.message || fallback text. Backend ProblemDetails 'detail' strings could contain internal info."
      fix: |
        Replace direct error.message display with a generic message in production.
        Log the actual error to an error reporting service (Sentry, etc.) instead.

    - id: SEC-012
      owasp_category: "A09:2021 Security Logging and Monitoring Failures"
      title: "Stack trace exposure in Development GlobalExceptionMiddleware"
      files:
        - path: backend/src/LinearPrecision.Api/Infrastructure/Middleware/GlobalExceptionMiddleware.cs
          line_range: "59-60"
          detail: "ex.ToString() in Development mode — risk if ASPNETCORE_ENVIRONMENT misconfigured in production"
      fix: |
        Add a startup guard: if (app.Environment.IsProduction() && app.Configuration.GetValue<bool>("ShowDetailedErrors"))
        throw new InvalidOperationException("ShowDetailedErrors must not be enabled in production.");
        Or remove ex.ToString() entirely and always log server-side only.

    - id: SEC-013
      owasp_category: "A06:2021 Vulnerable and Outdated Components"
      title: "No client-side password strength validation"
      files:
        - path: app/register/page.tsx
          line_range: "30-48"
          detail: "Only checks password === confirmPassword. No strength meter or client-side policy check."
        - path: app/reset-password/page.tsx
          line_range: "23-40"
          detail: "Same: only match check, no strength validation."
      fix: |
        Add client-side password validation matching backend policy:
        - Minimum 8 characters
        - At least one uppercase, one lowercase, one digit
        - At least 4 unique characters
        Show real-time feedback with a strength meter component.

    - id: SEC-014
      owasp_category: "A09:2021 Security Logging and Monitoring Failures"
      title: "No rate-limit feedback on frontend auth forms"
      files:
        - path: app/login/page.tsx
          line_range: "28-47"
          detail: "No handling for HTTP 429 responses. User sees generic error instead of 'too many attempts'."
      fix: |
        In getApiErrorMessage or the form handler, check for ApiError with status 429 and show
        a specific message: 'Too many attempts. Please wait before trying again.'

  security_patterns_missing:
    - pattern: "Security response headers middleware"
      description: "Must add CSP, HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy"
      priority: critical

    - pattern: "Rate limiting application to endpoints"
      description: "Must call .RequireRateLimiting() on auth and AI endpoint groups"
      priority: critical

    - pattern: "Secret management integration"
      description: "Must move secrets out of appsettings.json to environment variables or a vault solution"
      priority: critical

    - pattern: "Next.js middleware.ts for auth"
      description: "Server-side route protection to prevent content flash and SSR of protected pages"
      priority: medium

    - pattern: "ForwardedHeaders middleware"
      description: "Required for correct HTTPS detection and client IP logging behind reverse proxy"
      priority: medium

    - pattern: "Audit logging for security events"
      description: "Login attempts, password changes, token revocations should be logged to a dedicated audit stream"
      priority: medium

    - pattern: "HTTP Strict Transport Security (HSTS)"
      description: "Force HTTPS in browsers with HSTS header"
      priority: medium

    - pattern: "Input sanitization library for rich text"
      description: "If any feature introduces rich text editing (docs module), DOMPurify or similar is required"
      priority: low
