      location: backend/src/LinearPrecision.Api/appsettings.json:7
      concern: "CRITICAL: Key 'super-secret-development-key-that-is-at-least-32-bytes-long!' is in source control. If this file is used in production, all tokens can be forged."
    - area: "Database credentials hardcoded"
      location: backend/src/LinearPrecision.Api/appsettings.json:3
      concern: "MEDIUM: 'Username=lp;Password=dev' in source-controlled config"
    - area: "MinIO credentials hardcoded"
      location: backend/src/LinearPrecision.Api/appsettings.json:15-16
      concern: "MEDIUM: 'minioadmin/minioadmin' default credentials in config"
    - area: "No security headers in production"
      location: "backend/src/LinearPrecision.Api/Program.cs (middleware pipeline), next.config.ts"
      concern: "CRITICAL: No CSP, HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy headers configured"
    - area: "Rate limiters not applied to endpoints"
      location: backend/src/LinearPrecision.Api/Program.cs:226-255
      concern: "CRITICAL: Auth rate limiter (20/15min) exists but no endpoint calls .RequireRateLimiting('auth'), enabling brute-force"
    - area: "Refresh cookie Secure flag conditional"
      location: backend/src/LinearPrecision.Api/Modules/Identity/Endpoints/AuthCookieHelper.cs:15
      concern: "MEDIUM: Secure = httpContext.Request.IsHttps — behind a reverse proxy with HTTP backend, cookies may be sent over HTTP"
    - area: "User enumeration on registration"
      location: backend/src/LinearPrecision.Api/Modules/Identity/Endpoints/AuthEndpoints.cs:87
      concern: "MEDIUM: Specific error 'A user with this email already exists' reveals account existence"
    - area: "Error boundary leaks error.message"
      location: components/error-boundary.tsx:52
      concern: "LOW: Raw error.message displayed to users; backend ProblemDetails detail strings could contain internal info"
    - area: "No CSRF/antiforgery protection"
      location: "Not found in codebase"
      concern: "MEDIUM: No antiforgery middleware. Partially mitigated by Bearer auth + SameSite cookies, but cookie-based refresh endpoint could be targeted."
    - area: "No Next.js middleware.ts"
      location: "Root of project (file does not exist)"
      concern: "MEDIUM: All auth route protection is client-side only. Server-side rendering of protected pages may flash content before redirect."
    - area: "Stack traces in Development mode"
      location: backend/src/LinearPrecision.Api/Infrastructure/Middleware/GlobalExceptionMiddleware.cs:60
      concern: "LOW: ex.ToString() sent to client in Development mode — risk if ASPNETCORE_ENVIRONMENT is misconfigured in production"
    - area: "TenantResolutionMiddleware trusts header"
      location: backend/src/LinearPrecision.Api/Infrastructure/Middleware/TenantResolutionMiddleware.cs:47-50
      concern: "MEDIUM: X-Workspace-Id header is trusted without middleware-level membership check. EF query filters provide safety net, but a user could attempt to read data from a workspace they're not authorized for if any endpoint bypasses filters."
  authentication_patterns_in_domain: |
    JWT Bearer with 15-minute access tokens, Redis blocklist for revocation, refresh token rotation via httpOnly cookie, ASP.NET Identity password hashing with PBKDF2, account lockout after 5 failures for 15 minutes.
  authorization_patterns_in_domain: |
    Policy-based authorization with WorkspaceRoleRequirement checks (Owner > Admin > Member > Guest). EF global query filters scope all tenant data by WorkspaceId.
  data_validation_in_domain: |
    FluentValidation on all Identity request DTOs (Register, Login, ForgotPassword, ResetPassword). ASP.NET Identity enforces password policy. Frontend forms use HTML5 required + type validation but minimal client-side strength checks.

