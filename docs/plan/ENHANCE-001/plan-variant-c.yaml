    - "backend/src/LinearPrecision.Api/appsettings*.json — externalize secrets"
    - "app/ — add middleware.ts, loading.tsx files, dynamic imports"
    - "eslint.config.mjs — enhance with import ordering and unused detection"
    - "docs/ — sync architecture, feature matrix, integration status"
  component_details:
    - component: "Dead Code Cleanup"
      responsibility: "Remove app-data-context.tsx, clean types/shared.ts, remove from providers.tsx"
      interfaces:
        - "No new interfaces — removal only"
    - component: "Code Splitting Module"
      responsibility: "Dynamic imports for Recharts, DnD, markdown, AI copilot"
      interfaces:
        - "next/dynamic with ssr:false and loading fallbacks"
    - component: "Security Headers"
      responsibility: "CSP, HSTS, X-Frame-Options, X-Content-Type-Options on both Next.js and ASP.NET"
      interfaces:
        - "next.config.ts headers array"
        - "ASP.NET UseHsts(), UseXContentTypeOptions() middleware"
    - component: "UI Primitives"
      responsibility: "7 shared components: Button, Input, Avatar, Tooltip, Skeleton, Dropdown, Progress"
      interfaces:
        - "React FC with variant/size props, cn() for styling, forwardRef where applicable"
    - component: "Accessibility Layer"
      responsibility: "ARIA attributes, focus-visible rings, skip-link, keyboard navigation"
      interfaces:
        - "No new APIs — attribute additions to existing components"
    - component: "Auth Middleware"
      responsibility: "Server-side route protection via Next.js middleware.ts"
      interfaces:
