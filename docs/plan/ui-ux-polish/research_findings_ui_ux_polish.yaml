plan_id: ui-ux-polish
objective: Investigate UI/UX improvement opportunities across the PM SaaS frontend for a deep enhancement pass
focus_area: UI/UX Polish — visual consistency, accessibility, responsive design, loading states, animations, component library
created_at: "2026-04-16"
created_by: gem-researcher
status: completed

tldr: |
  - Design system has only 4 CSS custom tokens; missing semantic tokens for spacing, typography scale, border-radius, shadows, elevation, and status colors — each feature surface re-invents these values via raw Tailwind.
  - Severe accessibility gaps: zero ARIA labels on sidebar nav, no skip-link, no focus-visible rings anywhere, no aria-live regions, inconsistent keyboard navigation, and most interactive buttons lack accessible names.
  - Responsive design is implemented for sidebar/header but board, calendar, timeline, docs, goals, and workload surfaces are desktop-only with no mobile-specific adaptations for their main content areas.
  - Loading states are well-covered (Loader2 spinners + EmptyState) but there are no skeleton/shimmer placeholders (except automations), no route-level loading.tsx files, and error boundaries only exist at the root.
  - Motion usage is good for panels/modals/details but lacks page transition animations, list stagger effects, and micro-interactions on buttons/inputs.
  - Component library (components/ui/) has only 11 components — missing: Button, Input, Select, Textarea, Avatar, Tabs, Tooltip, Popover, Dropdown, Progress, Skeleton, Switch, Card, Table, Pagination, DatePicker, Dialog (non-modal).

research_metadata:
  methodology: "Hybrid retrieval: semantic_search + grep_search for pattern scanning, read_file for detailed examination across 30+ component files, file_search for missing route-level files"
  scope: "Examined globals.css, sidebar, header, 5 feature surfaces (board, calendar, inbox, projects, goals), all 11 UI components, layout.tsx, providers.tsx, and pattern-scanned all components/**/*.tsx"
  confidence: high
  coverage: 78
  decision_blockers: 0
  research_blockers: 0

# ═══════════════════════════════════════════════════════════════════════════════
# 1. DESIGN SYSTEM GAPS
# ═══════════════════════════════════════════════════════════════════════════════

design_system_analysis:
  current_tokens:
    file: app/globals.css
    variables:
      - name: "--color-primary"
        value: "#1313ec"
      - name: "--color-background-dark"
        value: "#0a0a0a"
      - name: "--color-neutral-border"
        value: "#222222"
      - name: "--color-neutral-surface"
        value: "#111111"
      - name: "--font-sans"
        value: "Inter via Google Fonts"
      - name: "--font-mono"
        value: "JetBrains Mono via Google Fonts"

  missing_tokens:
    - category: spacing
      description: "No spacing scale tokens. Components use arbitrary values: p-2, p-3, p-4, p-5, p-6, px-1.5, px-2.5, py-0.5, gap-1, gap-2, gap-3, gap-4. No consistent spacing rhythm."
      impact: high

    - category: border-radius
      description: "Mixed radius usage across features: rounded-sm (sidebar, header, board, automations), rounded-lg (board columns/cards, file-upload, docs, modal), rounded-xl (task-detail sections, settings), rounded-2xl (auth shell, docs editor), rounded-full (avatars, notification badge). No radius tokens defined."
      examples:
        - "sidebar nav items: rounded-sm"
        - "board task cards: rounded-lg"
        - "task-detail sections: rounded-xl"
        - "auth pages: rounded-2xl"
        - "modal: rounded-lg"
      impact: high

    - category: shadows
      description: "No shadow tokens. Ad-hoc shadows: shadow-xl, shadow-2xl for modals/dropdowns. Drag shadow on task cards is inline. No consistent elevation system."
      impact: medium

    - category: typography
      description: "No type scale tokens. Font sizes vary: text-[9px], text-[10px], text-[11px], text-[12px], text-[13px], text-[14px], text-[15px], text-sm, text-base, text-3xl. No heading hierarchy defined."
      impact: high

    - category: status-colors
      description: "Status/semantic colors repeated inline across features without tokens. Emerald for success, Rose for danger, Amber for warning, Blue for info — each component redeclares these (e.g., badge.tsx, goals-surface.tsx, task-card.tsx, calendar-detail.tsx)."
      impact: medium

    - category: interactive-states
      description: "Hover state pattern 'hover:bg-white/5' and 'hover:bg-white/[0.05]' used inconsistently — some use /5, others use /[0.03] or /[0.05] or /[0.02]. No active/pressed state token."
      impact: medium

    - category: surface-backgrounds
      description: "Surface backgrounds have multiple competing patterns: bg-neutral-surface, bg-neutral-surface/30, bg-neutral-surface/50, bg-white/[0.02], bg-white/[0.03], bg-background-dark. No layered elevation system."
      impact: medium

# ═══════════════════════════════════════════════════════════════════════════════
# 2. ACCESSIBILITY VIOLATIONS
# ═══════════════════════════════════════════════════════════════════════════════

accessibility_violations:
  critical:
    - id: a11y-001
      issue: "No skip-to-content link in layout"
      file: app/layout.tsx
      line: 30
      wcag: "2.4.1 Bypass Blocks (Level A)"
      description: "No skip navigation link. Users must tab through 20+ sidebar items to reach main content."

    - id: a11y-002
      issue: "Sidebar navigation has zero ARIA attributes"
      file: components/sidebar.tsx
      lines: "66-130"
      wcag: "4.1.2 Name, Role, Value (Level A)"
      description: "The <nav> element lacks aria-label. No nav link has aria-label or aria-current='page'. The mobile sidebar lacks role='dialog' and aria-modal='true'. Mobile close button lacks aria-label."

    - id: a11y-003
      issue: "No focus-visible indicators anywhere in the codebase"
      file: "*"
      wcag: "2.4.7 Focus Visible (Level AA)"
      description: "grep for 'focus-visible' returns zero matches across all components. Buttons rely only on hover styles. Keyboard users have no visual focus indicator."

    - id: a11y-004
      issue: "Board task cards have no keyboard interaction"
      file: components/board/task-card.tsx
      wcag: "2.1.1 Keyboard (Level A)"
      description: "Task cards use onClick on a div but no tabIndex, no role='button', no onKeyDown handler. Drag-and-drop has no keyboard alternative."

    - id: a11y-005
      issue: "Board columns and cards lack ARIA labels"
      file: components/board/board-column.tsx
      wcag: "4.1.2 Name, Role, Value (Level A)"
      description: "Board columns have no role='region' or aria-label. Column action buttons (Plus, MoreHorizontal) lack aria-label. Column count badge has no accessible meaning."

  serious:
    - id: a11y-006
      issue: "Inbox has no ARIA labels on interactive elements"
      file: components/inbox/inbox-layout.tsx
      wcag: "4.1.2 Name, Role, Value (Level A)"
      description: "Zero aria-label matches in inbox components. Filter rail, list items, action buttons all lack accessible names."

    - id: a11y-007
      issue: "Goals surface has no ARIA for tree structure"
      file: components/goals/goals-surface.tsx
      wcag: "1.3.1 Info and Relationships (Level A)"
      description: "Expandable goal tree has no role='tree', role='treeitem', aria-expanded attributes. Screen readers cannot understand the hierarchical goal structure."

    - id: a11y-008
      issue: "Modal does not trap focus"
      file: components/ui/modal.tsx
      wcag: "2.4.3 Focus Order (Level A)"
      description: "Modal handles Escape key but does not implement focus trapping. Tab can escape the modal to background content."

    - id: a11y-009
      issue: "Color-only status indicators"
      file: components/board/task-card.tsx
      lines: "42-48"
      wcag: "1.4.1 Use of Color (Level A)"
      description: "Priority badges use only color (rose/amber/blue/slate) to convey priority level. No icons or text alternatives for color-blind users."

    - id: a11y-010
      issue: "No aria-live regions for dynamic content"
      file: "*"
      wcag: "4.1.3 Status Messages (Level AA)"
      description: "Zero aria-live or role='status' or role='alert' across the codebase. Toast notifications, loading states, filter results counts, and real-time updates are invisible to screen readers."

    - id: a11y-011
      issue: "Projects list has no keyboard navigation pattern"
      file: components/projects/projects-layout.tsx
      wcag: "2.1.1 Keyboard (Level A)"
      description: "No aria-label on project list or grid. No roving tabindex or arrow key navigation."

