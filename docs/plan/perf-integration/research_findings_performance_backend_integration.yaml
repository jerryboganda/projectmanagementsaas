related_conventions:
  naming_patterns_in_domain: "Query keys follow [feature, workspaceId, ...segments] pattern. Hooks named use-{feature}-data.ts."
  structure_of_domain: "Each feature has components/{feature}/ with layout/surface/toolbar/detail/data files. Data hooks in hooks/ directory."
  error_handling_in_domain: "TanStack Query retry:1 for queries, retry:0 for mutations. No global error boundary for query errors."
  testing_in_domain: "No frontend unit tests found for hooks or components. Only E2E via Playwright."
  documentation_in_domain: "docs/frontend-to-backend-integration-matrix.md documents recommended staleTime per feature but implementation diverges."

