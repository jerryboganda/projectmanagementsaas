# ============================================================
# 2. DEAD CODE CANDIDATES
# ============================================================
dead_code_candidates:
- file: contexts/app-data-context.tsx
  lines: 714
  evidence: |
    - NOT mounted in app/providers.tsx (removed per decision-log.md entry)
    - docs/project-ssot.md line 25 states: "Legacy dead code (app-data-context.tsx) has been removed" — but the file still exists
    - docs/architecture.md line 68: "no longer mounted ... no current source consumers remain outside the file itself"
    - Only one external import exists: components/projects/data.ts re-exports 4 types from it
  recommendation: "Move the 4 re-exported types to types/shared.ts, then delete the file"

- file: components/ai-copilot-provider.tsx
  evidence: |
    - Mounted in app/providers.tsx (AiCopilotProvider wraps children)
    - Only consumer: components/header.tsx imports useAiCopilot
    - docs/decision-log.md line 161: "Keep ... as legacy/demo scaffolding until explicit cleanup approval"
    - The AI copilot is demo-only — no real AI backend integration exists
  recommendation: "Flagged as legacy scaffolding. Low priority but a removal candidate."

- file: types/shared.ts
  evidence: |
    - Defines User, TaskStatus, ProjectStatus, etc.
    - Zero imports found across the codebase — no file uses `from "@/types/shared"`
    - Duplicate of types already defined in contexts/app-data-context.tsx and individual data.ts files
  recommendation: "Either consolidate all feature data.ts types into this file and import from here, or delete it"

# ============================================================
# 3. DUPLICATED PATTERNS
# ============================================================
patterns_found:
- category: type-duplication
  pattern: "User/Member types duplicated across feature modules"
  description: |
    The `User` interface is defined independently in:
    - contexts/app-data-context.tsx (line 9)
    - types/shared.ts (line 3)
    - components/settings/data.ts has UserProfile (line 51) and Member (line 71)
    - components/intake/data.ts has MockMember (line 280)
    Each feature data.ts defines its own owner/assignee shapes instead of importing from a shared location.
  examples:
  - file: contexts/app-data-context.tsx
    location: "line 9"
    snippet: "export interface User { id: string; name: string; initials: string; avatar?: string; ... }"
  - file: types/shared.ts
    location: "line 3"
    snippet: "export interface User { id: string; name: string; initials: string; avatar?: string; ... }"
  prevalence: common

- category: type-duplication
  pattern: "Status and priority enums duplicated across modules"
  description: |
    Multiple modules define their own status/priority unions:
    - app-data-context.tsx: TaskStatus, TaskPriority, ProjectStatus, GoalStatus, etc.
    - types/shared.ts: TaskStatus, ProjectStatus, InitiativeStatus, GoalStatus, HealthStatus, Priority, ExtendedPriority
    - components/timeline/data.ts: TimelineStatus, TimelinePriority
    - components/workload/data.ts: WorkloadTone
    - components/goals/data.ts: GoalSurfaceStatus (different values than GoalStatus in shared.ts)
  examples:
  - file: types/shared.ts
    location: "line 16"
    snippet: "export type TaskStatus = 'To Do' | 'In Progress' | 'In Review' | 'Done';"
  - file: contexts/app-data-context.tsx
    location: "line 12"
    snippet: "export type TaskStatus = 'To Do' | 'In Progress' | 'In Review' | 'Done';"
  prevalence: common

- category: architecture
  pattern: "Monolithic layout components"
  description: |
    The project convention calls for layout → surface → toolbar → detail separation, but 6 features
    consolidate everything into a single *-layout.tsx file: time-tracking, automations, sprints,
    templates, intake. These files combine state management, toolbar, surface grid, and detail panel
    in one file, making them 769–1,799 lines.
  examples:
  - file: components/time-tracking/time-tracking-layout.tsx
    location: "entire file"
    snippet: "1,799 lines: state + toolbar + surface + detail + data"
  - file: components/automations/automations-layout.tsx
    location: "entire file"
    snippet: "963 lines: state + create/edit modal + list + detail"
  prevalence: common

- category: architecture
  pattern: "Inline status badge components"
  description: |
    Status badge rendering is duplicated as local components/functions in multiple files:
    - components/sprints/sprints-layout.tsx defines SprintStatusBadge (line 52)
    - components/issue-list.tsx defines PriorityBadge (line 16)
    - components/workload/workload-surface.tsx uses Badge with inline tone logic
    - components/workload/workload-detail.tsx duplicates the same Badge + tone pattern
    There is a shared components/ui/badge.tsx but usage is inconsistent.
  examples:
  - file: components/sprints/sprints-layout.tsx
    location: "line 52"
    snippet: "function SprintStatusBadge({ status }: { status: ... }) {"
  - file: components/issue-list.tsx
    location: "line 16"
    snippet: "const PriorityBadge = ({ priority }: { priority: string }) => {"
  prevalence: occasional

# ============================================================
# 4. ESLINT GAPS
# ============================================================
eslint_analysis:
  config_file: eslint.config.mjs
  config_contents: |
    Uses flat config with defineConfig.
    Only extends: eslint-config-next (which includes next/core-web-vitals, react, react-hooks).
    Zero custom rules defined.
    Zero plugin additions beyond defaults.
  eslint_version: "9.39.1"
  eslint_config_next_version: "16.0.8"

  build_integration: |
    next.config.ts does NOT set `eslint.ignoreDuringBuilds` (defaults to false in Next.js 15).
    However, the user states ESLint is disabled during builds — this may be configured elsewhere
    or the build simply succeeds because lint passes.

  missing_rules:
  - rule: "import/order or @typescript-eslint/consistent-type-imports"
    impact: "Import ordering convention stated in .claude/rules/frontend.md is not enforced"
  - rule: "no-unused-vars / @typescript-eslint/no-unused-vars"
    impact: "Dead exports and unused imports won't be caught automatically"
  - rule: "@typescript-eslint/no-explicit-any"
    impact: "Low risk currently (zero any usage found) but no guard against regression"
  - rule: "react/no-array-index-key"
    impact: "No check for key={index} anti-pattern"
  - rule: "max-lines or max-lines-per-function"
    impact: "No guard against file/function bloat"

  existing_suppressions:
  - file: components/timeline/timeline-create-modal.tsx
    rule: react-hooks/exhaustive-deps
    count: 2
  - file: components/board/board-surface.tsx
    rule: react-hooks/set-state-in-effect
    count: 1
  - file: components/board/task-detail.tsx
    rule: "@next/next/no-img-element"
    count: 1
  - file: components/onboarding/onboarding-wizard.tsx
    rule: react-hooks/exhaustive-deps
    count: 1

# ============================================================
# 5. TYPE SAFETY
# ============================================================
type_safety_analysis:
  tsconfig_strict: true
  no_emit: true
  skip_lib_check: true
  module_resolution: bundler
  typecheck_config: "tsconfig.typecheck.json extends tsconfig.json with incremental:false, excludes .next"

  any_usage: 0
  ts_ignore_count: 0
  ts_expect_error_count: 0
  assessment: |
    Type safety is excellent. Strict mode is enabled, there are zero any types and zero
    ts-ignore/ts-expect-error directives in the codebase. All 144 frontend source files pass
    typecheck cleanly.

# ============================================================
# 6. IMPORT ORGANIZATION
# ============================================================
import_organization:
  stated_convention: "React/Next → external libs → local components → types/data"
  enforcement: "None — no ESLint import/order rule configured"
  assessment: |
    The convention is documented in .claude/rules/frontend.md but not enforced by tooling.
    Manual inspection shows most files follow the convention loosely, but there is no guarantee
    of consistency across 144 files. Adding eslint-plugin-import with import/order rule
    would enforce this automatically.

