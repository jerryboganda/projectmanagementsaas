plan_id: perf-integration
objective: Investigate performance optimization and backend integration opportunities across the Project Management SaaS codebase
focus_area: performance_and_backend_integration
created_at: "2026-04-16"
created_by: gem-researcher
status: completed

tldr: |
  - Provider stack is 11 layers deep but well-memoized; the REAL re-render hotspot is app-data-context.tsx (800+ line monolith with ~500 lines of inline mock data) — though it has zero active consumers, making it dead code.
  - Zero dynamic imports / code splitting anywhere in the codebase — every feature (Recharts, DnD, motion, docs editor, AI copilot) ships in the initial bundle.
  - 12 feature data.ts files exist but only 1 (intake) still uses MOCK_ constants at runtime; the other 11 features have been migrated to TanStack Query + real API hooks.
  - SignalR is wired for board only (4 events: TaskCreated/Updated/Moved/Deleted); no realtime for inbox, timeline, sprints, calendar, goals, or docs.
  - All images use next/image correctly; no raw <img> tags found in component code.
  - TanStack Query is properly configured with 30s staleTime, retry:1, but has no gcTime override (defaults to 5min), no prefetching, and no placeholder/initialData patterns beyond one case.

research_metadata:
  methodology: "Hybrid retrieval: semantic_search + grep_search for pattern scanning, read_file for detailed examination of key files. 3-pass complex analysis."
  scope: "Full frontend codebase: next.config.ts, package.json, all hooks/, all contexts/, component data.ts files, app/ route pages, lib/ utilities"
  confidence: high
  coverage: 88
  decision_blockers: 0
  research_blockers: 0

