# OPEN QUESTIONS
# ═══════════════════════════════════════════════════════════════════════════════

open_questions:
  - question: "Should the project adopt a component library framework (e.g., Radix UI primitives) for accessible building blocks (Dialog, Popover, Tabs, Tooltip), or continue building custom?"
    context: "Current approach of hand-rolling every dropdown, modal focus trap, and tooltip is error-prone for accessibility. Radix + Tailwind is a common pattern."
    type: decision_blocker
    affects: ["button-component", "tooltip-component", "dropdown-component", "modal-focus-trap"]

  - question: "What is the target WCAG conformance level — A, AA, or AAA?"
    context: "Current codebase has Level A violations (keyboard access, focus visible, ARIA roles). The scope of accessibility remediation depends on target level."
    type: decision_blocker
    affects: ["all-accessibility-items"]

  - question: "Should mobile views for board/calendar/timeline be simplified views (list/agenda) or attempt to replicate desktop layouts responsively?"
    context: "Board kanban, calendar grid, and timeline gantt charts are inherently wide. Two approaches: responsive scaling vs. alternate mobile UX."
    type: research
    affects: ["board-responsive", "calendar-responsive", "timeline-responsive"]

