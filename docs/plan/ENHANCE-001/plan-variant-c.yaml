tldr: |
  Impact-first ordering: dead code + code splitting (instant DX/bundle win) → security headers + UI primitives →
  rate limiters + accessibility + type consolidation → component extraction + responsive → loading states +
  middleware + remaining security → integration + perf tuning → ESLint + docs sync.
  31 tasks across 7 waves. 4 tasks in wave 1 for maximum parallelism.
  Key serialization constraint: providers.tsx, globals.css, sidebar.tsx, header.tsx, layout.tsx must stay serialized.

open_questions: []

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "Dead code removal breaks hidden import chain"
      likelihood: low
      impact: high
      mitigation: "Build + typecheck validation immediately after each removal. Grep for all transitive imports before deleting."
    - scenario: "CSP header blocks inline scripts or styles used by Next.js"
      likelihood: medium
      impact: high
      mitigation: "Start with report-only CSP; add nonces for Next.js script injection. Test with browser devtools before enforcing."
    - scenario: "Component extraction introduces state-management regression in large files"
      likelihood: medium
      impact: high
      mitigation: "Extract one component at a time, validate build after each. Keep state in parent layout, pass via props."
    - scenario: "Dynamic imports cause flash-of-unstyled-content or layout shift"
      likelihood: medium
      impact: medium
      mitigation: "Use ssr:false only for chart/DnD components. Provide loading fallbacks with correct dimensions."
    - scenario: "Rate limiter policy breaks existing integration tests"
      likelihood: low
      impact: medium
      mitigation: "Use test-specific rate limit bypass header or generous test limits. Run dotnet test after wiring."
    - scenario: "providers.tsx serialization bottleneck slows multi-task waves"
      likelihood: high
      impact: low
      mitigation: "Only one task per wave touches providers.tsx. Other tasks in same wave work on disjoint files."
  assumptions:
    - "All 4 research findings are high-confidence and current as of 2026-04-16"
    - "Frontend build (npm run build) is the primary regression gate for frontend changes"
    - "Backend has 78 passing tests that must remain green throughout"
