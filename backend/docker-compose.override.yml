# docker-compose.override.yml — Dev overrides (ports, volumes, hot reload)
# Automatically merged by Docker Compose with docker-compose.yml

services:
  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      - ./src/LinearPrecision.Api:/app/src
    ports:
      - "5000:8080"

  worker:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      - ./src/LinearPrecision.Worker:/app/src

  postgres:
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
