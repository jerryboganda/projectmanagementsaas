      pattern: "Mobile hamburger toggle. Search bar hidden on mobile (md:flex). New-item label hidden on mobile (md:inline)."
      quality: good

    - component: Inbox
      file: components/inbox/inbox-layout.tsx
      pattern: "Master-detail pattern: list + detail side-by-side on desktop, stacked overlay on mobile with back button."
      quality: good

    - component: Settings
      file: components/settings/settings-content.tsx
      pattern: "Grid layouts with md:grid-cols breakpoints. Danger zone stacks on mobile (md:flex-row)."
