    - opportunity: "Input focus animation"
      description: "Inputs use CSS transition for border color. No animated focus ring expansion or glow effect."
      impact: low

    - opportunity: "Empty state entrance"
      description: "EmptyState renders without any animation. Could benefit from fade-in + slight y-offset."
      impact: low

    - opportunity: "Toolbar filter transitions"
      description: "When switching views (list↔grid, month↔week↔day), content swaps instantly without crossfade."
      impact: medium

    - opportunity: "Progress bar animation"
      description: "Goals progress bars and workload capacity bars render at final width instantly. No fill animation on mount."
      impact: medium

    - opportunity: "Notification badge bounce"
      description: "Inbox unread badge appears/disappears without attention-drawing animation."
      impact: low

