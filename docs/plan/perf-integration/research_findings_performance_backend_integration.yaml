patterns_found:
  - category: architecture
    pattern: "Feature hooks migrated to TanStack Query"
    description: "Most feature hooks (board, projects, dashboard, goals, calendar, reports, settings, documents, automations, sprints, templates, time-tracking, workload, timeline, portfolio) use TanStack Query with real API client calls. Only intake remains on mock data."
    examples:
      - file: hooks/use-board-data.ts
        location: "hooks/use-board-data.ts:3"
        snippet: "import { useMutation, useQuery, useQueryClient } from '@tanstack/react-query'"
      - file: hooks/use-projects-data.ts
        location: "hooks/use-projects-data.ts:3"
        snippet: "import { useMutation, useQuery, useQueryClient } from '@tanstack/react-query'"
    prevalence: common

  - category: architecture
    pattern: "Zero dynamic imports / code splitting"
    description: "No usage of next/dynamic or React.lazy found in any .tsx file. All components, including heavy ones (Recharts charts, @hello-pangea/dnd, motion animations, docs editor, AI copilot panel), are statically imported."
    examples:
      - file: components/reports/reports-surface.tsx
        location: "components/reports/reports-surface.tsx:1"
        snippet: "import { LineChart, Line, BarChart, Bar, ... } from 'recharts'"
      - file: components/board/board-layout.tsx
        location: "components/board/board-layout.tsx:5"
        snippet: "import { DropResult } from '@hello-pangea/dnd'"
    prevalence: common

  - category: architecture
    pattern: "Dead legacy context not in provider tree"
    description: "app-data-context.tsx is an 800+ line file with ~500 lines of inline mock data. AppDataProvider is NOT rendered in the provider tree (providers.tsx). useAppData() has zero callers. This is dead code contributing to module graph size."
    examples:
      - file: contexts/app-data-context.tsx
        location: "contexts/app-data-context.tsx:494"
        snippet: "const AppDataContext = createContext<AppDataContextType | undefined>(undefined)"
    prevalence: rare

  - category: naming
    pattern: "Consistent query key factories"
    description: "All hooks define typed query key factory functions following the pattern: featureQueryKey(workspaceId) → ['feature', workspaceId, ...] as const."
    examples:
      - file: hooks/use-board-data.ts
        location: "hooks/use-board-data.ts:31"
        snippet: "function tasksQueryKey(workspaceId: string | null) { return ['board', workspaceId, 'tasks'] as const; }"
      - file: hooks/use-goals-data.ts
        location: "hooks/use-goals-data.ts:33"
        snippet: "function goalsQueryKey(workspaceId: string | null) { return ['goals', workspaceId] as const; }"
    prevalence: common

  - category: architecture
    pattern: "Image optimization via next/image"
    description: "All 20+ image import sites use next/image Image component. No raw <img> tags in component code. picsum.photos is configured in next.config.ts remotePatterns."
    examples:
      - file: components/header.tsx
        location: "components/header.tsx:15"
        snippet: "import Image from 'next/image'"
      - file: components/board/task-card.tsx
        location: "components/board/task-card.tsx:3"
        snippet: "import Image from 'next/image'"
    prevalence: common

  - category: architecture
    pattern: "SignalR only wired for board"
    description: "Only hooks/use-board-data.ts subscribes to SignalR events (TaskCreated, TaskUpdated, TaskMoved, TaskDeleted on /hubs/board). No other feature hooks use the realtime context despite it being a generic connection factory."
    examples:
      - file: hooks/use-board-data.ts
        location: "hooks/use-board-data.ts:216-219"
        snippet: "connection.on('TaskCreated', handleTaskCreated); connection.on('TaskUpdated', handleTaskUpdated); connection.on('TaskMoved', handleTaskMoved); connection.on('TaskDeleted', handleTaskDeleted);"
    prevalence: rare

  - category: architecture
    pattern: "Sidebar and Header re-rendered on every route"
    description: "Every app/*/page.tsx imports and renders <Sidebar /> and <Header /> directly. These are not in the layout — they re-mount on every navigation. This is a pattern issue for perceived performance."
    examples:
      - file: app/board/page.tsx
        location: "app/board/page.tsx:3-4"
        snippet: "import { Sidebar } from '@/components/sidebar'; import { Header } from '@/components/header';"
    prevalence: common

  - category: architecture
    pattern: "Provider memoization correctly applied"
    description: "SidebarContext uses useCallback for state setters. WorkspaceContext uses useMemo for its value. AuthContext follows same pattern. QueryClient uses useState lazy init. No cascading re-render from provider layer."
    examples:
      - file: contexts/sidebar-context.tsx
        location: "contexts/sidebar-context.tsx:17-19"
        snippet: "const openMobile = useCallback(() => setIsMobileOpen(true), [])"
      - file: contexts/workspace-context.tsx
        location: "contexts/workspace-context.tsx:20"
        snippet: "const value = useMemo<WorkspaceContextValue>(() => { ... }, [session, setActiveWorkspaceId])"
    prevalence: common

  - category: architecture
    pattern: "Motion animations imported everywhere"
    description: "15+ components import motion/AnimatePresence from 'motion/react'. The 'motion' package is in transpilePackages but not code-split. Every page that renders animated components pulls the full motion runtime."
    examples:
      - file: components/sidebar.tsx
        location: "components/sidebar.tsx:4"
        snippet: "import { motion, AnimatePresence } from 'motion/react'"
      - file: components/workload/workload-surface.tsx
        location: "components/workload/workload-surface.tsx:4"
        snippet: "import { motion } from 'motion/react'"
    prevalence: common

related_architecture:
  components_relevant_to_domain:
    - component: "QueryClient (TanStack Query)"
      responsibility: "Client-side data cache and async state management"
      location: "app/providers.tsx"
      relationship_to_domain: "Central to all data fetching performance; staleTime and gcTime settings directly affect cache hits and refetch frequency"
    - component: "RealtimeProvider (SignalR)"
      responsibility: "WebSocket hub connection factory"
      location: "contexts/realtime-context.tsx"
      relationship_to_domain: "Under-utilized; only board uses it. Expanding coverage reduces polling and improves perceived performance"
    - component: "AppDataProvider (LEGACY)"
      responsibility: "Monolith mock data context"
      location: "contexts/app-data-context.tsx"
      relationship_to_domain: "Dead code. 815 lines contributing to module graph and build time."
    - component: "Feature data hooks"
      responsibility: "Per-feature TanStack Query wrappers"
      location: "hooks/use-*.ts (17 files)"
      relationship_to_domain: "Primary data loading layer; performance depends on query key design, caching, and deduplication"

  interfaces_used_by_domain:
    - interface: "LinearPrecisionApiClient"
      location: "lib/api/client.ts"
      usage_pattern: "All hooks access via useAuth().apiClient. REST fetch wrapper over the backend API."
    - interface: "HubConnection"
      location: "@microsoft/signalr"
      usage_pattern: "Created by RealtimeProvider.connect(hubPath). Board subscribes to 4 events."

  data_flow_involving_domain: |
    Page renders → hooks call useQuery → QueryClient checks cache (staleTime 30s) → if stale, fetches via apiClient → response cached → components re-render with data.
    For board only: SignalR pushes events → invalidateQueries → refetch → UI updates.
    For all other features: data is only refreshed on remount or manual refetch.

  key_relationships_to_domain:
    - from: "Feature hooks"
      to: "lib/api/client.ts"
      relationship: calls
    - from: "Feature hooks"
      to: "TanStack Query"
      relationship: imports
    - from: "hooks/use-board-data.ts"
      to: "contexts/realtime-context.tsx"
      relationship: calls
    - from: "app/providers.tsx"
      to: "All contexts"
      relationship: composes

