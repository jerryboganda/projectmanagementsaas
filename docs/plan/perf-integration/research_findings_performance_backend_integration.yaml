# ═══════════════════════════════════════════════════════════════

realtime_status:
  infrastructure:
    provider: contexts/realtime-context.tsx
    status: "Working generic hub factory"
    capabilities:
      - "Auto-reconnect with backoff [0, 2s, 10s, 30s]"
      - "Per-workspace hub connections"
      - "JWT access token factory"
      - "Disconnects on workspace switch"

  connected_features:
    - feature: board
      hub: "/hubs/board"
      events_subscribed:
        - TaskCreated
        - TaskUpdated
        - TaskMoved
        - TaskDeleted
      join_method: "JoinBoard(projectId)"
      invalidation_strategy: "invalidateQueries on any event"

  missing_realtime:
    - feature: inbox
      recommended_hub: "/hubs/notifications"
      events_needed: ["NotificationCreated", "NotificationRead", "NotificationArchived"]
      impact: "High — badge/count would update without page refresh"
    - feature: documents
      recommended_hub: "/hubs/documents"
      events_needed: ["DocumentUpdated", "DocumentDeleted", "CursorMoved"]
      impact: "High — enables collaborative editing"
    - feature: sprints
      recommended_hub: "/hubs/board"
      events_needed: ["SprintStarted", "SprintCompleted", "TaskReordered"]
      impact: "Medium — sprint boards are collaborative"
    - feature: timeline
      recommended_hub: "/hubs/board"
      events_needed: ["TaskUpdated", "TaskMoved"]
      impact: "Medium — Gantt chart reflects task date changes"
    - feature: calendar
      recommended_hub: "/hubs/calendar"
      events_needed: ["CalendarItemCreated", "CalendarItemUpdated", "CalendarItemDeleted"]
      impact: "Low — calendar less frequently multi-user edited"
    - feature: goals
      recommended_hub: "/hubs/goals"
      events_needed: ["GoalUpdated", "InitiativeUpdated"]
      impact: "Low — goal tracking is periodic"

open_questions:
  - question: "Should app-data-context.tsx be deleted or preserved for e2e/demo mode?"
    context: "It has zero runtime consumers but may be kept for demo/seed purposes"
    type: nice_to_know
    affects: ["bundle_size"]

  - question: "What is the actual production bundle size?"
    context: "No @next/bundle-analyzer configured. Cannot verify theoretical savings without baseline measurement."
    type: research
    affects: ["bundle_optimization"]

  - question: "Are there backend SignalR hubs beyond /hubs/board?"
    context: "Backend code not fully examined. Need to verify which hubs are already implemented before planning frontend wiring."
    type: research
    affects: ["realtime_expansion"]

gaps:
  - area: "Bundle size measurement"
    description: "No bundle analyzer configured. All size estimates are theoretical based on package sizes, not measured chunk analysis."
    impact: research_blocker
    affects: ["bundle_optimization"]

  - area: "Backend hub inventory"
    description: "Only the frontend side was researched. Backend may or may not have additional SignalR hubs implemented."
    impact: research_blocker
    affects: ["realtime_expansion"]

  - area: "Component-level profiling"
    description: "No React DevTools profiling data available. Re-render hotspots are inferred from code patterns, not measured."
    impact: nice_to_know
    affects: ["rendering_performance"]
